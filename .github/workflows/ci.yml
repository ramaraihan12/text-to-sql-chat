name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: text_to_sql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/text_to_sql
      TEST_DATABASE_URL: postgresql://sales_reader:sales_reader@localhost:5432/text_to_sql

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"

      - run: uv sync --locked

      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: tests (unit + integration)
        run: uv run pytest -v
